  <path d="M26 30l34-10 40 10 34-10v70l-34 10-40-10-34 10z" fill="#fff" stroke="#04386c" stroke-width="2.2"/>
  <path d="M60 20v70M100 30v70" stroke="#04386c" stroke-width="1.6" stroke-dasharray="3 3"/>
  <!-- Manzanas y lotes -->
  <path d="M34 42h20v18H34zM34 66h20v14H34zM68 40h24v16H68zM108 44h20v20h-20z" stroke="#006db3" stroke-width="1.6"/>
  <path d="M44 42v18M80 40v16M118 44v20M108 54h20" stroke="#006db3" stroke-width="1.2"/>
